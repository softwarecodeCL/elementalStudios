const PARTS = {
  2:{name:'Part 2 · Pregunta y respuesta', instr:'Escucharás una pregunta o afirmación y tres respuestas. Las respuestas no aparecen escritas: elige A, B o C.'},
  3:{name:'Part 3 · Conversaciones', instr:'Escucharás una conversación breve. Lee las preguntas antes de reproducir el audio y luego elige la mejor respuesta.'},
  4:{name:'Part 4 · Charlas y mensajes', instr:'Escucharás a una sola persona (mensaje de voz, anuncio). Lee las preguntas antes de reproducir el audio.'},
  5:{name:'Part 5 · Oraciones incompletas', instr:'Elige la palabra o frase que completa correctamente la oración.'},
  6:{name:'Part 6 · Completar textos', instr:'Completa los espacios del texto. Uno de ellos pide insertar una oración completa.'},
  7:{name:'Part 7 · Comprensión lectora', instr:'Lee el texto y responde las preguntas.'}
};

/* Flatten for indexing */
let qid = 0;
UNITS.forEach(u => u.qs.forEach(q => { q.id = qid++; q.sec = u.sec; q.part = u.part; }));
const ALLQ = UNITS.flatMap(u => u.qs);

/* ============ ESTADO ============ */
const KEY = 'es-toeic-diag-v2';
let S = load() || fresh();
function fresh(){ return {screen:'intro', unit:0, answers:{}, name:'', target:'650', start:null, end:null, transcripts:[], lead:null}; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); return s && s.screen ? s : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ============ CAPTURA DE LEADS ============ */
// La conexión se configura en public/diagnostico-toeic/config.js.
const LEAD_ENDPOINT = window.ELEMENTAL_TOEIC_CONFIG?.leadEndpoint?.trim() || '';
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function sendLead(lead){
  if(!LEAD_ENDPOINT) throw new Error('El formulario aún no está conectado.');
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    // Apps Script recibe una petición simple, sin preflight CORS.
    // La respuesta es opaca: este envío no confirma el guardado en Sheets.
    await fetch(LEAD_ENDPOINT, {method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(lead), signal:controller.signal});
  } finally { clearTimeout(timeout); }
}

/* Resumen del resultado: lo usan el informe y el registro del lead */
function summary(){
  const L = secStats('L'), R = secStats('R');
  const sL = scaled('L', L.pct), sR = scaled('R', R.pct);
  const sk = Object.entries(TAGS).map(([k, t]) => {
    const qs = ALLQ.filter(q => q.tag === k);
    const ok = qs.filter(q => S.answers[q.id] === q.ans).length;
    return {k, ...t, ok, n: qs.length, pct: ok / qs.length};
  });
  const prio = sk.filter(x => x.pct < 0.8).sort((a,b) => a.pct - b.pct || b.n - a.n).slice(0, 3);
  return {L, R, sL, sR, total: sL + sR, sk, prio};
}

/* ============ AUDIO (voces neuronales pregrabadas) ============ */
UNITS.forEach((u, i) => { if(u.audio) u.src = `/diagnostico-toeic/audio/u${i}.mp3`; });
let player = null;
function stopAudio(){ if(player){ player.pause(); player.onended = null; player = null; } }
/* ============ PUNTAJE ============ */
const round5 = n => Math.round(n / 5) * 5;
function secStats(sec){
  const qs = ALLQ.filter(q => q.sec === sec);
  const ok = qs.filter(q => S.answers[q.id] === q.ans).length;
  return {ok, n: qs.length, pct: ok / qs.length};
}
/* Curva aproximada de conversión TOEIC (orientativa) */
function scaled(sec, pct){
  const exp = sec === 'L' ? 0.9 : 1.1;
  return Math.max(5, Math.min(495, round5(5 + 490 * Math.pow(pct, exp))));
}
/* Umbrales MCER oficiales de ETS por sección */
const CEFR = {
  L:[[490,'C1'],[400,'B2'],[275,'B1'],[110,'A2'],[60,'A1']],
  R:[[455,'C1'],[385,'B2'],[275,'B1'],[115,'A2'],[60,'A1']]
};
const cefr = (sec, s) => (CEFR[sec].find(([t]) => s >= t) || [0,'< A1'])[1];
const TOTAL_BANDS = [[10,'A1'],[225,'A2'],[550,'B1'],[785,'B2'],[945,'C1'],[990,'']];

/* ============ RENDER ============ */
const $app = document.getElementById('app');
const $bar = document.getElementById('bar'), $fill = document.getElementById('barfill'), $meta = document.getElementById('topmeta');
let timer = null;

function render(){
  stopAudio();
  clearInterval(timer);
  if(S.screen === 'intro') renderIntro();
  else if(S.screen === 'test') renderUnit();
  else if(S.screen === 'lead') renderLead();
  else renderResults();
  window.scrollTo({top:0});
}

  $app.innerHTML = `

    </section>

    <section class="stack">

        <div class="field"><label for="f-target">Puntaje que necesitas</label>
          <select id="f-target">
            ${['450','550','650','750','850','0'].map(v => `<option value="${v}" ${S.target===v?'selected':''}>${v==='0'?'Aún no lo sé':v+' puntos'}</option>`).join('')}

      <div class="row"><button class="btn" id="go">Comenzar diagnóstico</button>
      ${S.start && !S.end ? '<button class="btn ghost" id="resume">Continuar donde quedé</button>' : ''}</div>
    </section>
  </div>`;
  document.getElementById('go').onclick = () => {
    S = fresh();
    S.name = document.getElementById('f-name').value.trim();
    S.target = document.getElementById('f-target').value;
    S.screen = 'test'; S.start = Date.now(); save(); render();
  };
  const r = document.getElementById('resume'); if(r) r.onclick = () => { S.screen = 'test'; save(); render(); };
}

/* ---------- Pantalla de registro antes del informe ---------- */
function renderLead(){
  if(!LEAD_ENDPOINT){ S.screen = 'results'; save(); renderResults(); return; }
  $bar.hidden = true; $meta.textContent = '';
  const m = summary();
  $app.innerHTML = `
  <div class="stack-lg">
    <section class="stack">
      <p class="eyebrow">Diagnóstico completado</p>
      <h1>Tu informe está listo</h1>
      <div class="lead-teaser"><span class="big">${m.total}</span><span class="muted">puntos TOEIC estimados · ${m.prio.length} habilidad${m.prio.length===1?'':'es'} prioritaria${m.prio.length===1?'':'s'} detectada${m.prio.length===1?'':'s'}</span></div>
      <p class="muted">Déjanos tus datos para ver el informe completo: puntaje por sección, nivel MCER, mapa de habilidades y qué estudiar primero. Un asesor de Elemental Studios te contactará para orientarte.</p>
    </section>
    <form class="sheet stack" id="leadform" novalidate>
      <div class="form">
        <div class="field"><label for="l-name">Nombre y apellido</label><input id="l-name" autocomplete="name" required value="${esc(S.name)}"></div>
        <div class="field"><label for="l-email">Correo electrónico</label><input id="l-email" type="email" autocomplete="email" required placeholder="nombre@empresa.cl"></div>
        <div class="field"><label for="l-phone">Teléfono (opcional)</label><input id="l-phone" type="tel" autocomplete="tel" placeholder="+56 9 1234 5678"></div>
        <div class="field"><label for="l-company">Empresa u hotel (opcional)</label><input id="l-company" autocomplete="organization"></div>
      </div>
      <label class="check"><input type="checkbox" id="l-consent"> <span>Acepto que Elemental Studios guarde mis datos y resultados para contactarme sobre cursos de preparación. Puedo pedir su eliminación en cualquier momento.</span></label>
      <p class="err" id="l-err" role="alert" hidden></p>
      <div class="row"><button class="btn" id="l-send" type="submit">Ver mi informe</button></div>
    </form>
  </div>`;
  const f = document.getElementById('leadform'), err = document.getElementById('l-err'), btn = document.getElementById('l-send');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const v = id => document.getElementById(id).value.trim();
    const name = v('l-name'), email = v('l-email');
    const fail = msg => { err.textContent = msg; err.hidden = false; };
    if(name.length < 2) return fail('Escribe tu nombre para personalizar el informe.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return fail('Revisa tu correo: debe tener el formato nombre@dominio.cl.');
    if(!document.getElementById('l-consent').checked) return fail('Marca la casilla de autorización para continuar.');
    err.hidden = true; btn.disabled = true; btn.textContent = 'Guardando…';
    const lead = {
      consentimiento: true,
      nombre: name, email, telefono: v('l-phone'), empresa: v('l-company'),
      examen: 'TOEIC Listening & Reading', meta: +S.target || null,
      total: m.total, listening: m.sL, reading: m.sR, mcerListening: cefr('L', m.sL), mcerReading: cefr('R', m.sR),
      prioridades: m.prio.map(x => x.name), usoTranscripcion: S.transcripts.length,
      minutos: S.end && S.start ? Math.round((S.end - S.start)/60000) : null,
      fecha: new Date().toISOString()
    };
    try { await sendLead(lead); }
    catch(e) {
      btn.disabled = false; btn.textContent = 'Ver mi informe';
      return fail('No pudimos enviar tus datos. Revisa tu conexión e inténtalo de nuevo.');
    }
    S.name = name; S.lead = {email, at: Date.now()}; S.screen = 'results'; save(); render();
  });
}

function fmtTime(ms){ const s = Math.floor(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

function renderUnit(){
  const u = UNITS[S.unit], P = PARTS[u.part];
  const firstIdx = u.qs[0].id;
  $bar.hidden = false;
  const answered = Object.keys(S.answers).length;
  $fill.style.width = (answered / ALLQ.length * 100) + '%';
  const tick = () => $meta.textContent = `${answered}/${ALLQ.length} · ${fmtTime(Date.now() - S.start)}`;
  tick(); timer = setInterval(tick, 1000);

  const isP2 = u.part === 2;
  const transcriptTxt = u.audio ? u.audio.map(([w,t]) => (u.part===3 ? (w==='M'?'Man: ':'Woman: ') : '') + t).join('\n') : '';
  const usedT = S.transcripts.includes(S.unit);

  $app.innerHTML = `
  <div class="stack-lg">
    <div class="part-head">
      <p class="eyebrow">${u.sec==='L'?'Listening':'Reading'}</p>
      <h2>${P.name}</h2>
      <p class="instr">${P.instr}</p>
    </div>
    <div class="sheet stack-lg">
      ${u.audio ? `
        <div class="stack">
          <div class="player">
            <button class="btn play" id="play"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5 3.5v13l11-6.5z"/></svg><span id="playlbl">Reproducir audio</span></button>
            <span class="wave" id="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="meta" id="plays"></span>
          </div>
          <div><button class="link" id="showT">${usedT ? 'Ocultar transcripción' : '¿No escuchas el audio? Ver transcripción'}</button></div>
          <div class="transcript" id="tr" ${usedT ? '' : 'hidden'}>${transcriptTxt}</div>
        </div>` : ''}
      ${u.passage ? `<div class="passage">${u.passage}</div>` : ''}
      <div class="stack">
        ${u.qs.map((q, k) => `
          <div class="q" data-q="${q.id}">
            ${q.stem ? `<p class="q-stem"><span class="qn">${q.id+1}.</span>${q.stem}</p>` : `<p class="q-stem"><span class="qn">${q.id+1}.</span>Elige la mejor respuesta.</p>`}
            <div class="opts ${isP2?'letters':''}" role="radiogroup" aria-label="Pregunta ${q.id+1}">
              ${q.opts.map((o, j) => `<button class="opt ${S.answers[q.id]===j?'sel':''}" role="radio" aria-checked="${S.answers[q.id]===j}" data-j="${j}"><b>${'ABCD'[j]}</b>${isP2 ? '' : `<span>${o}</span>`}</button>`).join('')}
            </div>
          </div>`).join('')}
      </div>
    </div>
    <div class="nav">
      <button class="btn ghost" id="prev" ${S.unit===0?'disabled':''}>Anterior</button>
      <button class="btn" id="next" disabled>${S.unit===UNITS.length-1?'Ver mi diagnóstico':'Siguiente'}</button>
    </div>
  </div>`;

  const next = document.getElementById('next');
  const check = () => next.disabled = !u.qs.every(q => S.answers[q.id] !== undefined);
  check();
  $app.querySelectorAll('.q').forEach(qe => {
    const id = +qe.dataset.q;
    qe.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      S.answers[id] = +b.dataset.j; save();
      qe.querySelectorAll('.opt').forEach(x => { const on = x === b; x.classList.toggle('sel', on); x.setAttribute('aria-checked', on); });
      check();
      const answeredNow = Object.keys(S.answers).length;
      $fill.style.width = (answeredNow / ALLQ.length * 100) + '%';
    });
  });

  if(u.audio){
    let plays = 0;
    const pb = document.getElementById('play'), lbl = document.getElementById('playlbl'), wave = document.getElementById('wave'), pc = document.getElementById('plays');
    pc.textContent = 'En el examen real se escucha una sola vez.';
    const done = () => {
      wave.parentElement.classList.remove('speaking');
      pb.disabled = plays >= 2;
      lbl.textContent = plays >= 2 ? 'Sin repeticiones' : 'Escuchar otra vez';
      pc.textContent = plays >= 2 ? 'Ya usaste tus 2 reproducciones.' : 'Te queda 1 repetición.';
    };
    pb.onclick = () => {
      if(plays >= 2) return;
      stopAudio();
      player = new Audio(u.src);
      plays++; pb.disabled = true; lbl.textContent = 'Reproduciendo…'; wave.parentElement.classList.add('speaking');
      player.onended = done;
      player.onerror = () => { plays--; done(); pc.textContent = 'No se pudo cargar el audio. Revisa tu conexión o usa la transcripción.'; };
      player.play().catch(() => player && player.onerror());
    };
    document.getElementById('showT').onclick = (e) => {
      const tr = document.getElementById('tr');
      tr.hidden = !tr.hidden;
      e.target.textContent = tr.hidden ? '¿No escuchas el audio? Ver transcripción' : 'Ocultar transcripción';
      if(!tr.hidden && !S.transcripts.includes(S.unit)){ S.transcripts.push(S.unit); save(); }
    };
  }

  document.getElementById('prev').onclick = () => { S.unit--; save(); render(); };
  next.onclick = () => {
    if(S.unit === UNITS.length - 1){ S.end = Date.now(); S.screen = LEAD_ENDPOINT ? 'lead' : 'results'; }
    else S.unit++;
    save(); render();
  };
}

function renderResults(){
  $bar.hidden = true; $meta.textContent = '';
  const {L, R, sL, sR, total, sk, prio} = summary();
  const target = +S.target;
  const gap = target ? target - total : 0;

  const state = p => p < 0.5 ? ['bad','Prioridad'] : p < 0.8 ? ['warn','Reforzar'] : ['good','Dominado'];
  const color = p => `var(--${state(p)[0]})`;
  const pos = v => ((v - 10) / 980 * 100).toFixed(2) + '%';

  const bandsHtml = TOTAL_BANDS.slice(0,-1).map(([v,l],i) => {
    const w = (TOTAL_BANDS[i+1][0] - v) / 980 * 100;
    const shade = ['var(--line)','color-mix(in srgb, var(--accent) 22%, var(--line))','color-mix(in srgb, var(--accent) 45%, var(--line))','color-mix(in srgb, var(--accent) 70%, var(--line))','var(--accent)'][i];
    return `<span style="width:${w}%;background:${shade}" title="${l}"></span>`;
  }).join('');

  const msgGap = !target ? 'Elige una meta en tu próximo intento para ver cuánto te falta.'
    : gap <= 0 ? `Tu estimación ya alcanza tu meta de ${target}. Practica con exámenes completos para asegurar el resultado.`
    : `Te faltan cerca de <b>${gap} puntos</b> para tu meta de ${target}.`;

  const lowSec = (L.pct < R.pct) ? 'Listening' : (R.pct < L.pct ? 'Reading' : null);
  const mins = S.end && S.start ? Math.round((S.end - S.start)/60000) : null;

  $app.innerHTML = `
  <div class="stack-lg">
    <section class="stack">
      <p class="eyebrow">Tu diagnóstico${S.name ? ' · ' + esc(S.name) : ''}</p>
      <h1>Puntaje TOEIC estimado: ${total}</h1>
      <p class="muted">${msgGap} ${lowSec ? `Tu sección más débil es <b>${lowSec}</b>.` : ''}</p>
    </section>

    ${S.lead && LEAD_ENDPOINT ? '<p class="note">La solicitud de contacto fue enviada. Si no recibes respuesta, puedes escribirnos directamente por WhatsApp.</p>' : ''}
    <section class="score-head">
      <div class="score main"><div class="lbl">Total estimado</div><div class="val">${total}</div><div class="sub">Escala orientativa 10–990</div></div>
      <div class="score"><div class="lbl">Listening</div><div class="val">${sL}<span class="cefr">${cefr('L', sL)}</span></div><div class="sub muted mono">${L.ok}/${L.n} correctas</div></div>
      <div class="score"><div class="lbl">Reading</div><div class="val">${sR}<span class="cefr">${cefr('R', sR)}</span></div><div class="sub muted mono">${R.ok}/${R.n} correctas</div></div>
    </section>

    <section class="sheet stack">
      <h3>Dónde estás en la escala TOEIC</h3>
      <div class="gauge">
        <div class="mark you" style="left:${pos(total)}">Tú · ${total}<i></i></div>
        ${target ? `<div class="mark goal" style="left:${pos(target)};${Math.abs(target-total)<90?'top:-22px':''}">Meta · ${target}<i></i></div>` : ''}
        <div class="track">${bandsHtml}</div>
        <div class="ticks">${TOTAL_BANDS.map(([v,l]) => `<span style="left:${pos(v)}">${v}${l?' '+l:''}</span>`).join('')}</div>
      </div>
      <p class="meta">Franjas MCER aproximadas según el puntaje total. ETS publica los umbrales oficiales por sección (Listening y Reading por separado), que son los que se usan en las tarjetas de arriba.</p>
    </section>

    ${S.transcripts.length ? `<div class="warnbox">Usaste la transcripción en ${S.transcripts.length} audio${S.transcripts.length>1?'s':''}. Tu puntaje de Listening puede estar sobreestimado.</div>` : ''}

    <section class="stack">
      <h2>Qué mejorar primero</h2>
      ${prio.length ? `<ol class="prio">${prio.map(s => `
        <li><div class="hd"><h3>${s.name}</h3><span class="pill ${state(s.pct)[0]}">${s.ok}/${s.n} correctas</span></div>
        <p class="meta">${s.sec==='L'?'Listening':'Reading'}</p><p>${s.tip}</p></li>`).join('')}</ol>`
      : '<p>No hay habilidades por debajo del 80%. Tu siguiente paso es practicar con exámenes completos y cronometrados.</p>'}
    </section>

    <section class="sheet stack">
      <h3>Mapa de habilidades</h3>
      <div class="skills">
        ${sk.map(s => `<div class="sk"><div class="nm">${s.name}<small>${s.sec==='L'?'Listening':'Reading'} · <span class="pill ${state(s.pct)[0]}">${state(s.pct)[1]}</span></small></div>
          <div class="mbar"><i style="width:${Math.max(4, s.pct*100)}%;background:${color(s.pct)}"></i></div>
          <div class="pct">${s.ok}/${s.n}</div></div>`).join('')}
      </div>
    </section>

    <section class="stack review">
      <h2>Revisión pregunta por pregunta</h2>
      <div>
      ${UNITS.map((u, ui) => u.qs.map(q => {
        const a = S.answers[q.id], ok = a === q.ans;
        const optTxt = j => u.part === 2 ? (u.audio[j+1][1]) : `${'ABCD'[j]}. ${q.opts[j]}`;
        return `<details><summary><span class="${ok?'ok':'ko'}">${ok?'✓':'✗'}</span><span><b class="mono">${q.id+1}.</b> ${PARTS[q.part].name.split(' · ')[0]} · ${TAGS[q.tag].name}</span></summary>
          <div class="body">
            ${u.part===2 ? `<p class="muted">Audio: "${u.audio[0][1]}"</p>` : (q.stem && q.stem.length>4 ? `<p class="muted">${q.stem}</p>` : '')}
            <p>Tu respuesta: ${a===undefined?'—':optTxt(a)}</p>
            ${ok ? '' : `<p>Correcta: <b>${optTxt(q.ans)}</b></p>`}
            <p class="muted">${q.exp}</p>
          </div></details>`;
      }).join('')).join('')}
      </div>
    </section>

    <section class="cta">
      <h2>Prepara tu TOEIC con Elemental Studios</h2>
      <p>Con este diagnóstico armamos un plan de preparación enfocado en tus brechas. Nuestros programas para empresas pueden acceder a franquicia tributaria SENCE.</p>
      <div class="row">
        <a class="btn" href="https://wa.link/phiydi" target="_blank" rel="noopener" style="text-decoration:none">Hablar con un asesor</a>
        <button class="btn ghost" id="again">Repetir diagnóstico</button>
      </div>
    </section>

    <p class="meta">Diagnóstico orientativo de ${ALLQ.length} preguntas${mins!==null?` · lo completaste en ${mins} min`:''}. El puntaje es una estimación y no reemplaza un examen oficial de ETS. TOEIC es una marca registrada de ETS; esta herramienta no está afiliada ni respaldada por ETS.</p>
  </div>`;
  document.getElementById('again').onclick = () => { const t = S.target, n = S.name; S = fresh(); S.target = t; S.name = n; save(); render(); };
}

render();
</script> </body> </html>
